<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Traffic AI - Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --text-main: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, var(--bg-color));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .blob {
            position: absolute; filter: blur(80px); z-index: -1; opacity: 0.5;
        }
        .blob-1 { top: 10%; left: 10%; width: 300px; height: 300px; background: #3b82f6; }
        .blob-2 { bottom: 10%; right: 10%; width: 400px; height: 400px; background: #8b5cf6; }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: #94a3b8; margin-bottom: 2rem; }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 2px dashed var(--accent);
            border-radius: 8px;
            color: white;
            font-family: inherit;
        }
        input[type="text"] {
            border-style: solid;
            border-color: #475569;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .error { color: #ef4444; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <h1>Traffic & Weather AI</h1>
        <p>Upload footage and enter city for climate context.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/" method="POST" enctype="multipart/form-data">
            <input type="text" name="city" placeholder="Enter City Name (e.g. New York)" required>
            <input type="file" name="video" accept="video/*" required>
            <button type="submit">Start Analysis</button>
        </form>
    </div>
</body>
</html>
